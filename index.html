<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nova Peptide Research Dashboard</title>
<meta name="theme-color" content="#0a1530">
<meta name="description" content="Purchases, sales, inventory and financials for Nova Peptide Research Canada.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell — brand header, one scrolling view, fixed bottom tab bar; sheets slide over for forms. */
:root{
  --bg:#eef4f8; --surface:#ffffff; --surface-2:#f5f9fb; --line:#d9e4ec;
  --fg:#12204a; --muted:#5d6b86; --navy:#1b2a6b; --teal:#0f9fb0; --teal-2:#18c1d3; --teal-soft:#dff4f7;
  --good:#1a8a5a; --good-soft:#e1f4ea; --warn:#b06d00; --warn-soft:#fdf0d8; --bad:#c23a3a; --bad-soft:#fbe5e5;
  --shadow:0 1px 2px rgba(18,32,74,.06),0 6px 20px rgba(18,32,74,.06);
  --f-display:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08112a; --surface:#0f1c3d; --surface-2:#132449; --line:#22355f;
  --fg:#e7eef8; --muted:#94a5c4; --navy:#8fa6ff; --teal:#37cfdf; --teal-2:#5fe0ec; --teal-soft:#0f3442;
  --good:#4fd093; --good-soft:#0f3328; --warn:#f2b34a; --warn-soft:#3a2b0e; --bad:#ff7a7a; --bad-soft:#3f1a22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08112a; --surface:#0f1c3d; --surface-2:#132449; --line:#22355f;
  --fg:#e7eef8; --muted:#94a5c4; --navy:#8fa6ff; --teal:#37cfdf; --teal-2:#5fe0ec; --teal-soft:#0f3442;
  --good:#4fd093; --good-soft:#0f3328; --warn:#f2b34a; --warn-soft:#3a2b0e; --bad:#ff7a7a; --bad-soft:#3f1a22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.money{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img{height:40px;width:auto;flex:none}
.wordmark{min-width:0}
.wordmark b{display:block;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.01em;line-height:1.1;white-space:nowrap}
.wordmark b span{color:var(--teal)}
.wordmark b em{font-style:normal;color:var(--navy)}
.wordmark small{display:block;font-family:var(--f-display);font-weight:600;font-size:10px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
.fx{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;cursor:pointer;text-align:right;line-height:1.15}
.fx b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.fx small{font-size:10px;color:var(--muted);letter-spacing:.04em}

/* main */
main{max-width:880px;margin:0 auto;padding-block:18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--f-display);font-weight:700;font-size:clamp(15px,4.4vw,20px);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.kpis:not(.k4){grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi.hl{background:linear-gradient(135deg,var(--navy),var(--teal));border:0;color:#fff}
.kpi.hl span{color:rgba(255,255,255,.8)}
.kpi i{font-style:normal;font-size:12px;color:var(--muted)}
.kpi.hl i{color:rgba(255,255,255,.85)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:44px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#08112a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#08112a}}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);background:transparent;border-color:transparent;min-height:36px;padding:6px 10px}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
details.card>summary{list-style:none;cursor:pointer;padding:14px;display:flex;gap:12px;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
.sum-main{flex:1;min-width:0}
.sum-main b{display:block;font-weight:700}
.sum-main small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.sum-amt{text-align:right;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sum-amt small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;color:var(--muted)}
.chev{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .15s}
details[open]>summary .chev{transform:rotate(90deg)}
.detail{border-top:1px solid var(--line);padding:6px 14px 12px;background:var(--surface-2)}
.lines{display:grid}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.line:last-child{border-bottom:0}
.line>div{min-width:0}
.line small{display:block;color:var(--muted);font-size:12px}
.line .money{white-space:nowrap;font-weight:600}
.sub{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

.list{display:grid;gap:10px}
.cust{display:grid;gap:0}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;background:var(--teal-soft);color:var(--teal)}
.sale{padding:10px 0;border-bottom:1px solid var(--line)}
.sale:last-child{border-bottom:0}
.sale-h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.sale-items{font-size:13px;color:var(--muted);margin-top:2px}

.cap{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.inv{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:left;width:100%}
.item .sum-main b{font-size:15px}
.stock{text-align:right;flex:none}
.stock b{font-family:var(--f-display);font-size:22px;font-weight:800;display:block;line-height:1;font-variant-numeric:tabular-nums}
.stock small{font-size:11px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;text-transform:uppercase}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--bad-soft);color:var(--bad)}
.pill.neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--surface)}

.empty{border:1.5px dashed var(--line);border-radius:16px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
.empty p{margin:0 auto;max-width:42ch;font-size:14px}

/* tables & bars */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.pos{color:var(--good);font-weight:600} td.neg{color:var(--bad);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.split{display:grid;gap:8px}
.split .line{font-size:14px}
.months{display:grid;gap:12px}
.month{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center}
.month>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.bars{display:grid;gap:4px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums;min-width:0}
.bar i{display:block;height:10px;border-radius:5px;min-width:2px}
.bar i.r{background:var(--teal)} .bar i.e{background:var(--navy);opacity:.55}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--teal)}
nav.tabs a[aria-current="page"] svg{stroke-width:2.2}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-h .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-h h3{flex:1;margin:0;font-family:var(--f-display);font-weight:700;font-size:17px}
.sheet-b{max-width:640px;margin:0 auto;display:grid;gap:14px;padding-block:16px calc(32px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea,.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;min-height:44px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface);min-height:40px}
.seg button{border:0;background:transparent;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.lineform{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.lineform .top-row{display:flex;gap:8px;align-items:center}
.lineform .top-row select{flex:1}
.lineform .opts{display:flex;gap:8px;flex-wrap:wrap}
.calc{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.calc b{color:var(--fg);font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:20px;line-height:1;flex:none}
.totals{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.totals .line{border:0;padding:2px 0}
.totals .grand{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-family:var(--f-display);font-weight:800;font-size:18px}
.note{font-size:12.5px;color:var(--muted)}
.warn{font-size:12.5px;color:var(--warn);font-weight:600}
.newitem{background:var(--teal-soft);border:1px solid var(--teal);border-radius:14px;padding:12px;display:grid;gap:10px}
.cart-line{display:grid;grid-template-columns:minmax(0,1fr) 70px 90px 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.cart-line .inp{padding:8px;min-height:38px}
.cart-line b{font-size:14px;display:block}
.cart-line small{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.foot{text-align:center;font-family:var(--f-display);font-size:10px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;padding-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:#fff;border:1px solid var(--line)}
.dateedit{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;font-size:12.5px;min-height:32px}
.backup{display:grid;gap:8px}
.hero-vial{width:100%;max-width:260px;aspect-ratio:1;object-fit:cover;border-radius:18px;margin:0 auto;display:block;border:1px solid var(--line);background:#fff}
.thumb.sm{width:36px;height:36px;border-radius:8px}
.cart-name{display:flex;gap:8px;align-items:center;min-width:0}
.cart-name>div{min-width:0}
.pick-row{display:flex;gap:10px;align-items:center}
.pick-row select{flex:1;min-width:0}
.empty-photo{display:grid!important;place-items:center;align-content:center;gap:8px;color:var(--muted);font-size:13px;background:var(--surface-2)!important}
.empty-photo .cap{width:28px;height:28px}
/* ---- v2 additions ---- */
nav.tabs .in{max-width:620px;grid-template-columns:repeat(5,1fr)}
nav.tabs a{position:relative;font-size:10.5px}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;letter-spacing:0;line-height:1}
.badge.teal{background:var(--teal)}
button.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;position:relative}
button.kpi::after{content:"i";position:absolute;top:9px;right:10px;width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;font:700 10px/13px var(--f-body);text-align:center;opacity:.45;font-style:italic}
button.kpi:active{transform:scale(.985)}
.kpi.pos b{color:var(--good)} .kpi.neg b{color:var(--bad)}
.netcard{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;color:#fff;border:0;border-radius:18px;padding:16px 18px;background:linear-gradient(135deg,var(--navy),var(--teal));position:relative}
.netcard.neg{background:linear-gradient(135deg,#6b1b2a,var(--bad))}
.netcard span{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.85}
.netcard b{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8.5vw,38px);line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.netcard i{display:block;font-style:normal;font-size:12.5px;opacity:.9;margin-top:4px}
.netcard::after{content:"How is this worked out?";position:absolute;top:14px;right:16px;font-size:11px;font-weight:600;opacity:.8;text-decoration:underline}
.cadtag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:4px 10px;width:max-content}
.pill.paid{background:var(--good-soft);color:var(--good)}
.pill.unpaid{background:var(--bad-soft);color:var(--bad)}
.pill.open{background:var(--warn-soft);color:var(--warn)}
.pill.cancelled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.sale-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.order{display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:14px;padding:12px 14px}
.stock .pend{display:block;font-size:11px;color:var(--warn);font-weight:700;margin-top:3px;white-space:nowrap}
.eq{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.eq .ln{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.eq .ln:last-child{border-bottom:0}
.eq .ln b{font-variant-numeric:tabular-nums;white-space:nowrap}
.eq .ln.res{border-top:2px solid var(--fg);border-bottom:0;font-weight:800;font-family:var(--f-display);font-size:16px;margin-top:2px}
.eq .op{display:inline-block;width:18px;color:var(--muted);font-weight:700}
.formula{font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--teal-soft);color:var(--fg);border-radius:12px;padding:12px 14px;line-height:1.4}
.inex{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.inex>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.inex b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.inex ul{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:4px}
.inex .yes b{color:var(--good)} .inex .no b{color:var(--muted)}
.danger-zone{border:1.5px solid var(--bad);border-radius:14px;padding:14px;display:grid;gap:10px;background:var(--bad-soft)}
.danger-zone b{color:var(--bad);font-family:var(--f-display)}
.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.outline-red{color:var(--bad);border-color:var(--bad);background:var(--surface)}
.warnbox{border-radius:14px;padding:14px;background:var(--bad-soft);color:var(--fg);display:grid;gap:8px}
.warnbox ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.okbox{border-radius:14px;padding:14px;background:var(--good-soft);display:grid;gap:8px}
.okbox ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.problems{max-height:240px;overflow:auto;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.problems li{margin-bottom:4px}
.radio{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.radio input{margin-top:3px;width:18px;height:18px;accent-color:var(--teal)}
.radio small{display:block;color:var(--muted);font-size:12.5px}
.month .net{font-size:12px;font-weight:700;margin-top:2px}
.month .net.pos{color:var(--good)} .month .net.neg{color:var(--bad)}
.bar i.n{background:var(--good)}
.tapnote{font-size:12px;color:var(--muted)}
/* phone tiles: no clipped amounts */
.kpi b{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;font-size:clamp(16px,4.6vw,21px)}
@media (max-width:520px){
  .kpis:not(.k4){grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis:not(.k4)>.kpi:first-child{grid-column:1/-1}
  .kpis.fin{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis.fin>.kpi:first-child{grid-column:auto}
}
.order-wrap{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:14px;overflow:hidden}
.order-wrap.waiting{border-left-color:var(--bad)}
.order-wrap .order{border:0;border-radius:0;border-left:0}
.order-acts{display:flex;gap:8px;justify-content:flex-end;padding:0 14px 12px}
.order .sum-main small+small{margin-top:4px}
.ni-photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ni-photo .thumb{width:56px;height:56px}

/* sign-in / setup screen */
.gate{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 50% 30%,#0e2350 0%,#050b1e 70%);color:#e7eef8;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
.gate[hidden]{display:none}
.gate .gcard{width:100%;max-width:420px;text-align:center}
.gate .glogo{width:min(64vw,260px);aspect-ratio:1;border-radius:22%;display:block;margin:0 auto 22px;box-shadow:0 0 40px rgba(24,193,211,.25)}
.gate h2{font-family:var(--f-display);font-size:22px;margin:0 0 8px;letter-spacing:.01em;color:#fff;text-transform:none}
.gate p{color:#b6c3dc;line-height:1.5;margin:0 0 14px;font-family:var(--f-body)}
.gate .gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:14px;border:0;background:#fff;color:#1b2a6b;font:700 16px var(--f-body);margin-top:6px;cursor:pointer}
.gate .glink{display:block;width:100%;background:none;border:0;color:#5fe0ec;font:600 15px var(--f-body);padding:12px;cursor:pointer}
.gate .gerr{background:#3f1a22;color:#ffb3b3;border-radius:12px;padding:10px 12px;margin:0 0 12px;font:500 14px var(--f-body);text-align:left}
.gate textarea{white-space:pre;overflow:auto;width:100%;font:12px ui-monospace,Menlo,Consolas,monospace;background:#0b1631;color:#cfe;border:1px solid #22355f;border-radius:12px;padding:10px;text-align:left;resize:none}
</style>
</head>

if(!c||!c.apiKey||/PASTE/i.test(c.apiKey)){g.innerHTML='<h2>One more setup step</h2><p>This app isn’t connected to your Firebase project yet.</p><p>Open <b>firebase-config.js</b> in your GitHub repository and paste in the settings Firebase gave you (Step 3 of the setup guide).</p>';return}
var s=document.createElement('script');s.type='module';s.src='cloud.js';
s.onerror=function(){g.innerHTML='<h2>Can’t connect</h2><p>The app couldn’t reach Firebase. Check your internet connection, then reload.</p><button class="gbtn" onclick="location.reload()">Reload</button>'};
document.body.appendChild(s);
setTimeout(function(){if(/Loading…/.test(g.textContent))g.innerHTML='<h2>Can’t connect</h2><p>The app couldn’t reach Firebase. Check your internet connection, then reload.</p><button class="gbtn" onclick="location.reload()">Reload</button>'},15000);})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
